name: Build and deploy Godot Web

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag containing StarryPassage-source.zip
        required: false
        default: v0.1.0-alpha

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download project archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ steps.release.outputs.tag }}" --pattern StarryPassage-source.zip

      - name: Unpack project
        run: unzip -q StarryPassage-source.zip

      - name: Install Godot 4.3 and export templates
        shell: bash
        run: |
          curl -fL --retry 3 -o godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          curl -fL --retry 3 -o templates.tpz \
            https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q godot.zip -d godot
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q templates.tpz -d templates
          cp -a templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          chmod +x godot/Godot_v4.3-stable_linux.x86_64

      - name: Export Web build
        run: |
          mkdir -p StarryPassage/web
          ./godot/Godot_v4.3-stable_linux.x86_64 \
            --headless --path StarryPassage --import
          ./godot/Godot_v4.3-stable_linux.x86_64 \
            --headless --path StarryPassage --export-release Web web/index.html
          test -s StarryPassage/web/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: StarryPassage/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
