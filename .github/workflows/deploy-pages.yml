name: Redirect legacy GitHub Pages game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create redirect page
        shell: bash
        run: |
          mkdir -p site
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="refresh" content="0;url=https://starry-passage-metaverse.yjrp9pq529.chatgpt.site/">
            <link rel="canonical" href="https://starry-passage-metaverse.yjrp9pq529.chatgpt.site/">
            <title>星路元宇宙</title>
          </head>
          <body>
            <p>正在进入<a href="https://starry-passage-metaverse.yjrp9pq529.chatgpt.site/">星路元宇宙</a>…</p>
            <script>location.replace("https://starry-passage-metaverse.yjrp9pq529.chatgpt.site/");</script>
          </body>
          </html>
          HTML
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
